# Публикация в npm по тегу — без токенов и секретов.
#
# Зачем: DSH показывает кнопку «Обновить» только для пакетов, установленных из
# реестра. Публикация вручную — это каждый раз «поднять версию, закоммитить,
# npm login, npm publish». Здесь достаточно поставить тег.
#
# Аутентификация — Trusted Publishing (OIDC): GitHub выдаёт короткоживущий
# токен на один запуск, npm проверяет его по настроенному доверенному
# издателю. Долгоживущий NPM_TOKEN не нужен, хранить нечего, утекать нечему.
#
# Настройка на npmjs.com (один раз, ПОСЛЕ первой ручной публикации — до неё
# пакета ещё нет и настроить издателя негде):
#   Package → Settings → Trusted Publisher → GitHub Actions:
#     Organization or user: d3d-root
#     Repository:           dsh-plugin-agent-browser
#     Workflow filename:    publish.yml
#     Environment:          (оставить пустым)
#
# Выпуск новой версии:
#   1. Поднимите "version" в package.json и допишите раздел в CHANGELOG.md.
#   2. git commit && git push
#   3. git tag v1.0.3 && git push origin v1.0.3
#
# Проверка, что тег совпадает с версией в манифесте, стоит до публикации:
# иначе npm отвергнет загрузку уже после всех проверок.

name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # id-token нужен для OIDC: без него npm не сможет подтвердить, что публикует
  # именно этот workflow этого репозитория.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22: npm 11.5.1+ требуется для OIDC, а он идёт с этим рантаймом.
      # registry-url намеренно не задаём: setup-node тогда прописал бы в .npmrc
      # `_authToken=${NODE_AUTH_TOKEN}`, а токена у нас нет — npm упал бы с
      # ENONPMTOKEN вместо того, чтобы использовать OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Убедиться, что npm умеет OIDC
        run: |
          npm install -g npm@latest
          npm --version

      # Версия в теге и в package.json должна совпадать.
      - name: Проверить совпадение тега и версии
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VERSION, тег: $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией $PKG_VERSION"
            exit 1
          fi

      # Тесты моста не требуют ни сети, ни DSH.
      - name: Тесты
        run: node --test --test-force-exit test/bridge.test.mjs test/plugin.test.mjs

      - name: Проверить синтаксис
        run: node --check lib/index.js && node --check lib/bridge.mjs

      # Токена нет: npm получает OIDC-токен от GitHub сам.
      # --provenance добавляет подписанное подтверждение сборки: пользователь
      # видит, из какого коммита и какого workflow собран пакет.
      - name: Публикация
        run: npm publish --access public --provenance
