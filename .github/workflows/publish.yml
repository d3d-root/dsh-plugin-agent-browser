# Публикация в npm по тегу — без токенов и секретов.
#
# Зачем: DSH показывает кнопку «Обновить» только для пакетов, установленных из
# реестра. Публикация вручную — это каждый раз «поднять версию, закоммитить,
# npm login, npm publish». Здесь достаточно поставить тег.
#
# Аутентификация — Trusted Publishing (OIDC): GitHub выдаёт короткоживущий
# токен на один запуск, npm проверяет его по настроенному доверенному
# издателю. Долгоживущий NPM_TOKEN не нужен, хранить нечего, утекать нечему.
#
# Настройка на npmjs.com (один раз, ПОСЛЕ первой ручной публикации — до неё
# пакета ещё нет и настроить издателя негде):
#   Package → Settings → Trusted Publisher → GitHub Actions:
#     Organization or user: d3d-root
#     Repository:           dsh-plugin-agent-browser
#     Workflow filename:    publish.yml
#     Environment:          (оставить пустым)
#
# Выпуск новой версии:
#   1. Поднимите "version" в package.json и допишите раздел в CHANGELOG.md.
#   2. git commit && git push
#   3. git tag v1.0.3 && git push origin v1.0.3
#
# Проверка, что тег совпадает с версией в манифесте, стоит до публикации:
# иначе npm отвергнет загрузку уже после всех проверок.

name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  # contents: write нужен, чтобы записать отчёт о публикации в релиз:
  # журнал шага виден только владельцу репозитория, а релиз читается кем
  # угодно — так причину сбоя можно увидеть без доступа к настройкам.
  contents: write
  # id-token нужен для OIDC: без него npm не сможет подтвердить, что публикует
  # именно этот workflow этого репозитория.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22: npm 11.5.1+ требуется для OIDC, а он идёт с этим рантаймом.
      # registry-url намеренно не задаём: setup-node тогда прописал бы в .npmrc
      # `_authToken=${NODE_AUTH_TOKEN}`, а токена у нас нет — npm упал бы с
      # ENONPMTOKEN вместо того, чтобы использовать OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Убедиться, что npm умеет OIDC
        run: |
          npm install -g npm@latest
          npm --version

      # Версия в теге и в package.json должна совпадать.
      - name: Проверить совпадение тега и версии
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VERSION, тег: $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией $PKG_VERSION"
            exit 1
          fi

      # Тесты не требуют ни сети, ни DSH.
      - name: Тесты
        run: node --test-force-exit test/all.test.mjs

      - name: Проверить синтаксис
        run: node --check lib/index.js && node --check lib/bridge.mjs

      # Токена нет: npm получает OIDC-токен от GitHub сам.
      # --provenance добавляет подписанное подтверждение сборки: пользователь
      # видит, из какого коммита и какого workflow собран пакет.
      #
      # Вывод сохраняем в файл: если npm ответит «успешно», а версии в реестре
      # не будет, без этого текста причину не узнать (журнал шага читает только
      # владелец репозитория). Шаг намеренно не падает здесь — падать должен
      # шаг проверки ниже, чтобы отчёт успел записаться.
      - name: Публикация
        run: |
          set +e
          npm publish --access public --provenance > publish.log 2>&1
          code=$?
          echo "код выхода npm publish: $code" >> publish.log
          cat publish.log
          exit 0

      # Главная проверка: npm мог ответить успехом, но не опубликовать.
      # Смотрим в реестр — там ли версия.
      - name: Проверить, что версия в реестре
        id: verify
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "Проверяю dsh-plugin-agent-browser@$VERSION в реестре"
          for i in 1 2 3 4 5 6; do
            if npm view "dsh-plugin-agent-browser@$VERSION" version > /dev/null 2>&1; then
              echo "Версия $VERSION опубликована"
              echo "published=yes" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "попытка $i: пока нет, жду 15 секунд"
            sleep 15
          done
          echo "published=no" >> "$GITHUB_OUTPUT"
          echo "::error::Версия $VERSION НЕ появилась в реестре — смотри отчёт в релизе"
          exit 1

      # Отчёт о публикации. Пишется всегда — и при успехе, и при сбое.
      - name: Записать отчёт в релиз
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.verify.outputs.published }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          {
            echo "## Публикация $VERSION"
            echo ""
            echo "Версия в реестре: ${PUBLISHED:-неизвестно}"
            echo ""
            echo '```'
            cat publish.log 2>/dev/null || echo "файла с выводом нет"
            echo '```'
            echo ""
            echo "Версии в реестре сейчас:"
            echo ""
            echo '```'
            npm view dsh-plugin-agent-browser versions 2>&1 | tail -20
            echo '```'
          } > report.md
          gh release view "v$VERSION" > /dev/null 2>&1 || \
            gh release create "v$VERSION" --title "$VERSION" --notes "Публикация в npm" > /dev/null
          gh release edit "v$VERSION" --notes-file report.md > /dev/null
          echo "отчёт записан в релиз v$VERSION"
