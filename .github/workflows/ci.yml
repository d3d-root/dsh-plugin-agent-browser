# Проверка на каждый push и pull request.
#
# Отдельно от publish.yml: тот запускается только по тегу и публикует. Здесь —
# только проверки, без публикации. Смысл в том, чтобы сломанный коммит было
# видно сразу, а не после выпуска версии.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Плагин ставится на Windows, macOS и Linux — проверяем, что код
        # переносим: пути, переводы строк и обработка файлов.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Тесты
        run: node --test --test-force-exit test/bridge.test.mjs test/plugin.test.mjs

      - name: Синтаксис
        run: |
          node --check lib/index.js
          node --check lib/bridge.mjs
          node -e "new Function(require('fs').readFileSync('lib/client.js','utf8'))"

      - name: Манифест валиден
        run: node -e "const p=require('./package.json'); if(!p.dsh||!p.dsh.bundle) throw new Error('нет dsh.bundle'); if(!p.dsh.client) throw new Error('нет dsh.client'); console.log('ok', p.name, p.version)"

      - name: Бандл-патч валиден
        run: node -e "const fs=require('fs'); const t=fs.readFileSync('cordis.patch.yml','utf8'); if(!t.includes('insert:')) throw new Error('нет insert'); if(!t.includes('dsh-plugin-agent-browser')) throw new Error('нет имени пакета'); console.log('ok')"
