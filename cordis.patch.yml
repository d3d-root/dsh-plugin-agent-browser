# Патч бандла «Браузер агента».
#
# DSH собирает дерево плагинов слоями: сначала бандлы профиля, потом
# cordis.patch.yml профиля. Этот файл — слой самого плагина: он добавляет
# строку загрузчика. `insert` — единственная операция, которая создаёт новую
# строку (остальные правят уже существующие).
#
# `name` резолвится как обычный ESM-пакет от каталога профиля, поэтому здесь
# стоит имя пакета, а не путь.
#
# Все поля `config` необязательны: значения по умолчанию подставляются в
# lib/index.js. Раскомментируйте то, что хотите поменять.
- insert:
    - id: agent-browser
      name: dsh-plugin-agent-browser
      config:
        # Стартовая страница новой вкладки.
        startUrl: https://www.google.com
        # Язык подписей: auto | ru | en. `auto` — по локали системы.
        language: auto
        # Переключать чат на сессию агента, когда браузер открывается.
        focusOnOpen: true
        # Открывать вкладку автоматически, если инструмент вызван без неё.
        autoOpen: true
        # Сколько ждать ответа браузера на одну команду, мс.
        timeoutMs: 30000
        # Писать ли отладочный журнал (он же — диагностика при проблемах).
        debug: true
